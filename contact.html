---
layout: default
title: titles.contact
namespace: contact
permalink: /contact/
---

<div class="min-h-screen bg-linear-to-b from-white to-gray-50">
  <section class="py-20 bg-gray-50">
    <div class="max-w-3xl mx-auto px-6">
      <div class="text-center mb-12">
        <h1 class="text-4xl font-bold text-gray-900 mb-4">{% t contact.title %}</h1>
        <p class="text-gray-600">{% t contact.intro %}</p>
      </div>

      <div class="space-y-4">
        <div class="p-4 bg-white rounded-lg shadow-sm">
          <h2 class="font-bold text-gray-900 mb-1">{% t contact.github_label %}</h2>
          <a href="https://github.com/rustporto"
             class="text-blue-600 hover:underline">github.com/rustporto</a>
        </div>

        <div class="p-4 bg-white rounded-lg shadow-sm">
          <h2 class="font-bold text-gray-900 mb-1">{% t contact.where_label %}</h2>
          <p class="text-gray-600">{% t contact.where %}</p>
        </div>
      </div>
    </div>
  </section>
</div>
